name: Refresh profile visuals
on:
  schedule:
    - cron: '27 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/render_profile.py'
      - '.github/workflows/profile-visuals.yml'
permissions:
  contents: write
concurrency:
  group: profile-visuals
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Render public statistics and project artwork
        run: python3 scripts/render_profile.py
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: Yash789k
          outputs: |
            assets/contribution-snake.svg?color_snake=%23794dd6&color_dots=%23ebedf0,%23d2fae3,%2386e8b3,%2342c985,%23158c59
            assets/contribution-snake-dark.svg?palette=github-dark&color_snake=%2352f5a3&color_dots=%23161b22,%23163135,%23214a49,%232e8171,%2368d8ff
      - name: Validate SVG files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for file in Path('assets').glob('*.svg'):
              root = ET.fromstring(file.read_text())
              assert root.tag.endswith('svg'), file
              assert file.stat().st_size < 2_000_000, file
              assert not any(e.tag.rsplit('}', 1)[-1] in {'script', 'foreignObject'} for e in root.iter()), file
          assert Path('assets/contribution-snake.svg').is_file()
          assert Path('assets/contribution-snake-dark.svg').is_file()
          PY
      - name: Commit refreshed visuals
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh public profile visuals [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
