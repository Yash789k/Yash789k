<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
<title id="title">Yash Kataria — ML/AI, data systems, developer tools</title><desc id="desc">Animated terminal header. Based in Hong Kong. Curiosity in. Working software out.</desc>
